name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['24', '26']
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar los tipos del código y de las pruebas
        run: npm run typecheck

      - name: Ejecutar las pruebas
        run: npm test

      - name: Compilar la extensión
        run: npm run build

      - name: Validar el complemento con web-ext
        run: npm run lint:extension
